<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f7f9">
<title>Europa</title>
<style>
:root{
  --fundo:#e7ebf0; --superficie:#f6f7f9; --card:#fff;
  --texto:#1c2430; --texto-2:#5c6b7a; --linha:#d5dde6;
  --azul:#163a5f; --azul-claro:#e8eef5;
  --ambar:#8a5a12; --ambar-claro:#fbf0dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--fundo);color:var(--texto);
  font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
}
.card{width:100%;max-width:420px;background:var(--superficie);border-radius:24px;padding:28px 20px}
.mark{width:52px;height:52px;border-radius:16px;margin:0 auto 16px;background:var(--azul-claro);color:var(--azul);
  display:flex;align-items:center;justify-content:center}
.mark svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.02em;text-align:center}
.sub{margin:0 0 20px;font-size:.875rem;color:var(--texto-2);text-align:center}
input[type=password]{
  width:100%;min-height:52px;padding:0 14px;
  font:inherit;font-size:17px; /* abaixo de 16px o Safari do iPhone dá zoom ao focar */
  color:var(--texto);background:var(--card);border:1px solid var(--linha);border-radius:12px;
}
input[type=password]:focus{outline:2px solid var(--azul);outline-offset:-1px}
.lembrar{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:6px;font-size:.875rem;color:var(--texto-2)}
.lembrar input{width:20px;height:20px;accent-color:var(--azul)}
button{
  width:100%;min-height:52px;margin-top:8px;font:inherit;font-weight:600;
  color:#fff;background:var(--azul);border:0;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
button:disabled{opacity:.6;cursor:default}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;
  animation:g .8s linear infinite;display:none}
button.busy .spin{display:block}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.msg{margin:14px 0 0;min-height:20px;font-size:.875rem;text-align:center;color:var(--texto-2)}
.msg.erro{color:var(--ambar);background:var(--ambar-claro);border-radius:12px;padding:10px 12px}
.nota{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--linha);font-size:.8125rem;color:var(--texto-2);text-align:center}
.oculto{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
  </div>
  <h1>Europa · fev 2027</h1>
  <p class="sub" id="sub">Abrindo…</p>

  <form id="f" class="oculto" autocomplete="on">
    <!-- campo de usuário oculto: sem ele o Keychain do iPhone não oferece salvar a senha -->
    <input type="text" name="username" value="roteiro" autocomplete="username"
           tabindex="-1" aria-hidden="true" readonly
           style="position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none">
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Senha master"
           aria-label="Senha master" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="lembrar"><input type="checkbox" id="l" checked> Lembrar neste aparelho</label>
    <button id="b" type="submit"><span class="spin" aria-hidden="true"></span><span id="bt">Abrir</span></button>
    <p class="nota">Recebeu o link do roteiro? Abra por ele — não precisa de senha.</p>
  </form>

  <p class="msg" id="m" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("d").textContent);
  var K_MESTRE="viagem-v2-mestre", K_VIS="viagem-v2-visitante";
  var f=document.getElementById("f"), p=document.getElementById("p"), l=document.getElementById("l"),
      b=document.getElementById("b"), bt=document.getElementById("bt"),
      m=document.getElementById("m"), sub=document.getElementById("sub");

  function b64(s){
    s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
    var bin=atob(s), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    return a;
  }
  function b64url(a){
    var s=""; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function txt(s){ return new TextEncoder().encode(s); }
  function diz(t,erro){ m.textContent=t; m.className="msg"+(erro?" erro":""); }
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||""; if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return "";} }
  function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k)||""; if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v);}catch(e){return "";} }
  function formulario(msg,erro){
    sub.textContent="Senha master";
    f.className=""; diz(msg||"",erro); p.focus();
  }
  /* deixa o navegador pintar o "carregando" antes do PBKDF2 (~1s no celular).
     O timeout cobre aba em segundo plano, onde o requestAnimationFrame não roda. */
  function pintar(){ return new Promise(function(r){
    var feito=false; function ok(){ if(!feito){ feito=true; setTimeout(r,0); } }
    requestAnimationFrame(function(){ requestAnimationFrame(ok) }); setTimeout(ok,150);
  })}

  function hkdf(raw,info){
    return crypto.subtle.importKey("raw",raw,"HKDF",false,["deriveBits"]).then(function(k){
      return crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt:new Uint8Array(0),info:txt(info)},k,256);
    }).then(function(x){ return new Uint8Array(x); });
  }
  function abrir(kv){
    return crypto.subtle.importKey("raw",kv,"AES-GCM",false,["decrypt"]).then(function(k){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv),tagLength:128},k,b64(D.ct));
    }).then(function(buf){
      var html=new TextDecoder("utf-8").decode(buf);
      /* entrega o documento inteiro: os <script> internos precisam executar */
      document.open(); document.write(html); document.close();
    });
  }

  if(!(window.crypto && window.crypto.subtle)){
    diz("Este navegador não expõe o WebCrypto. Abra a página por https://.",1); return;
  }

  /* 1) link dos filhos (#v=…)  2) link já usado neste aparelho  3) senha master lembrada */
  var h=/[#&]v=([A-Za-z0-9_-]{43})/.exec(location.hash);
  var mestre=ls(K_MESTRE)||ss(K_MESTRE);
  var tentativa=null;
  if(h) tentativa=Promise.resolve({kv:b64(h[1]),link:1});
  else if(ls(K_VIS)) tentativa=Promise.resolve({kv:b64(ls(K_VIS))});
  else if(mestre) tentativa=hkdf(b64(mestre),"viagem-europa/visitante").then(function(kv){ return {kv:kv}; });

  if(tentativa){
    tentativa.then(function(t){
      return abrir(t.kv).then(function(){ if(t.link) ls(K_VIS,b64url(t.kv)); });
    })["catch"](function(){
      ls(K_VIS,null); ls(K_MESTRE,null); ss(K_MESTRE,null);
      formulario(h?"Este link não abre a versão atual. Peça o link novo.":"",!!h);
    });
  } else formulario();

  f.addEventListener("submit",function(e){
    e.preventDefault();
    var senha=p.value; if(!senha) return;
    b.disabled=true; b.className="busy"; bt.textContent="Abrindo…"; diz("");
    pintar().then(function(){
      return crypto.subtle.importKey("raw",txt(senha),"PBKDF2",false,["deriveBits"]);
    }).then(function(k){
      return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(D.sal),iterations:D.it,hash:"SHA-256"},k,256);
    }).then(function(x){
      var raw=new Uint8Array(x);
      return hkdf(raw,"viagem-europa/visitante").then(function(kv){
        /* o app lê a chave daqui para abrir o cofre das reservas sem pedir de novo */
        ls(K_MESTRE,null); ss(K_MESTRE,null);
        if(l.checked) ls(K_MESTRE,b64url(raw)); else ss(K_MESTRE,b64url(raw));
        return abrir(kv)["catch"](function(err){ ls(K_MESTRE,null); ss(K_MESTRE,null); throw err; });
      });
    })["catch"](function(){
      b.disabled=false; b.className=""; bt.textContent="Abrir";
      diz("Senha incorreta.",1); p.value=""; p.focus();
    });
  });
})();
</script>
