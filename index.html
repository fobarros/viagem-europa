<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Roteiro · acesso protegido</title>
<style>
:root{
  --m-primary:#a8c8ff; --m-on-primary:#00305f;
  --m-primary-c:#004689; --m-on-primary-c:#d5e3ff;
  --m-error:#ffb4a9; --m-error-c:#840e10; --m-on-error-c:#ffdad5;
  --m-bg:#111418; --m-s-low:#191c20; --m-s:#1d2024; --m-s-high:#282a2f;
  --m-on-surface:#e1e2e9; --m-on-surface-v:#c3c7cf;
  --m-outline:#8d9199; --m-outline-v:#43474e;
  --e2:0 1px 2px rgba(0,0,0,.5),0 2px 6px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--m-bg);color:var(--m-on-surface);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
}
.card{
  width:100%;max-width:420px;background:var(--m-s-low);
  border:1px solid var(--m-outline-v);border-radius:28px;
  padding:28px 22px;box-shadow:var(--e2);
}
.mark{
  width:52px;height:52px;border-radius:16px;margin:0 auto 18px;
  background:var(--m-primary-c);color:var(--m-on-primary-c);
  display:flex;align-items:center;justify-content:center;
}
.mark svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 4px;font-size:22px;line-height:1.22;font-weight:600;text-align:center;
  letter-spacing:-.005em}
.sub{margin:0 0 22px;font-size:13px;color:var(--m-on-surface-v);text-align:center}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--m-on-surface-v);margin:0 0 7px}
input[type=password]{
  width:100%;min-height:56px;padding:0 16px;
  /* 16px é o mínimo: abaixo disso o Safari do iPhone dá zoom ao focar */
  font:inherit;font-size:17px;
  color:var(--m-on-surface);background:var(--m-s);
  border:1px solid var(--m-outline);border-radius:14px;
}
input[type=password]:focus{outline:2px solid var(--m-primary);outline-offset:-2px;
  border-color:var(--m-primary)}
button{
  width:100%;min-height:56px;margin-top:16px;
  font:inherit;font-size:16px;font-weight:600;
  color:var(--m-on-primary);background:var(--m-primary);
  border:0;border-radius:28px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
button:disabled{opacity:.6;cursor:default}
.spin{
  width:18px;height:18px;border-radius:50%;
  border:2.5px solid currentColor;border-top-color:transparent;
  animation:g .8s linear infinite;display:none;
}
button.busy .spin{display:block}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.msg{
  margin-top:14px;min-height:20px;font-size:13.5px;text-align:center;
  color:var(--m-on-surface-v);
}
.msg.erro{
  color:var(--m-on-error-c);background:var(--m-error-c);
  border-radius:12px;padding:10px 12px;
}
.nota{
  margin:22px 0 0;padding-top:18px;border-top:1px solid var(--m-outline-v);
  font-size:12.5px;line-height:1.45;color:var(--m-on-surface-v);
}
.nota b{color:var(--m-on-surface)}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
  </div>
  <h1>Roteiro protegido</h1>
  <p class="sub">Digite a senha combinada para abrir.</p>

  <form id="f" autocomplete="on">
    <!-- campo de usuário oculto: sem ele o Keychain do iPhone não oferece
         salvar a senha, e o Chrome reclama no console -->
    <input type="text" name="username" value="roteiro" autocomplete="username"
           tabindex="-1" aria-hidden="true" readonly
           style="position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none">
    <label for="p">Senha</label>
    <input id="p" name="password" type="password" autocomplete="current-password"
           enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false"
           inputmode="text" required>
    <button id="b" type="submit"><span class="spin" aria-hidden="true"></span><span id="bt">Abrir roteiro</span></button>
  </form>

  <p class="msg" id="m" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
  "use strict";
  var f=document.getElementById("f"), p=document.getElementById("p"),
      b=document.getElementById("b"), bt=document.getElementById("bt"),
      m=document.getElementById("m");
  var D=JSON.parse(document.getElementById("d").textContent);

  function b64(s){
    var bin=atob(s), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    return a;
  }
  function diz(txt,erro){ m.textContent=txt; m.className="msg"+(erro?" erro":""); }
  function ocupado(on){
    b.disabled=on; b.className=on?"busy":""; bt.textContent=on?"Decifrando…":"Abrir roteiro";
  }
  /* deixa o navegador pintar o estado de carregando antes de travar
     no PBKDF2 — no celular são ~1s de 600 mil iterações */
  function pintar(){ return new Promise(function(r){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(r,0) }) });
  })}

  if(!(window.crypto && window.crypto.subtle)){
    diz("Este navegador não expõe o WebCrypto. Abra a página por https://.",1);
    b.disabled=true; return;
  }

  f.addEventListener("submit",function(e){
    e.preventDefault();
    var senha=p.value;
    if(!senha){ diz("Digite a senha.",1); return; }
    ocupado(true); diz("Decifrando no aparelho…",0);

    pintar().then(function(){
      return crypto.subtle.importKey("raw", new TextEncoder().encode(senha),
        {name:"PBKDF2"}, false, ["deriveKey"]);
    }).then(function(base){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:b64(D.s), iterations:D.it, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(chave){
      return crypto.subtle.decrypt(
        {name:"AES-GCM", iv:b64(D.iv), tagLength:128}, chave, b64(D.ct));
    }).then(function(buf){
      var html=new TextDecoder("utf-8").decode(buf);
      /* entrega o documento inteiro ao navegador: os <script> internos
         precisam executar, e document.write faz o parser rodá-los */
      document.open();
      document.write(html);
      document.close();
    })["catch"](function(){
      /* a tag do AES-GCM não fecha: ou a senha está errada, ou o arquivo
         foi corrompido. Não dá para distinguir, e não interessa distinguir. */
      ocupado(false);
      diz("Senha incorreta. A proteção aqui é só a força da senha — não há bloqueio por tentativas.",1);
      p.value=""; p.focus();
    });
  });

  p.focus();
})();
</script>
